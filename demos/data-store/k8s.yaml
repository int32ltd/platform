# Workloads of the data-store demo. No namespace and no database here:
#
#   localenv (default)   `localenv apps apply` creates namespace
#                        catalog-data-store, the database, the extra roles
#                        and Secret catalog-data-store-db on the shared
#                        PostgreSQL 18 cluster (postgres-rw.postgres.svc, TLS)
#   standalone (CI)      demo.sh deploys standalone.yaml and creates the same
#                        database, roles and Secret itself
#
#   kubectl apply -n <namespace> -f k8s.yaml        (./demo.sh up does this)
---
# A psql client for demo.sh: connects to the shared cluster as the database
# owner, with the server certificate verified against the cluster root CA.
# Same image as the server's major version (Debian, glibc).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psql
spec:
  replicas: 1
  selector:
    matchLabels: { app: psql }
  template:
    metadata:
      labels: { app: psql }
    spec:
      containers:
        - name: psql
          image: docker.io/postgres:18.2-trixie   # Debian (glibc), pinned minor
          command: ["sleep", "infinity"]
          env:
            - { name: PGHOST,     valueFrom: { secretKeyRef: { name: catalog-data-store-db, key: host } } }
            - { name: PGPORT,     valueFrom: { secretKeyRef: { name: catalog-data-store-db, key: port } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: catalog-data-store-db, key: database } } }
            - { name: PGUSER,     valueFrom: { secretKeyRef: { name: catalog-data-store-db, key: username } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: catalog-data-store-db, key: password } } }
            - { name: PGSSLMODE,     value: verify-full }
            - { name: PGSSLROOTCERT, value: /etc/dev-test-ca/ca.crt }
            - { name: PGAPPNAME,     value: catalog-data-store-demo }
          volumeMounts:
            - { name: dev-test-ca, mountPath: /etc/dev-test-ca, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: dev-test-ca
          configMap: { name: dev-test-ca, optional: true }   # absent in standalone mode
---
# OpenFGA, the decision service for everything outside the catalog database.
# In-memory datastore: the demo reloads it from authz.fga_tuples
# (`fga/drift.py sync`). The image is a static Go binary on Wolfi (glibc).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 1
  selector:
    matchLabels: { app: openfga }
  template:
    metadata:
      labels: { app: openfga }
    spec:
      containers:
        - name: openfga
          image: docker.io/openfga/openfga:v1.22.1
          args: ["run"]
          env:
            - { name: OPENFGA_DATASTORE_ENGINE, value: memory }
            - { name: OPENFGA_PLAYGROUND_ENABLED, value: "false" }
            - { name: OPENFGA_LOG_LEVEL, value: warn }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
spec:
  selector: { app: openfga }
  ports:
    - { name: http, port: 8080, targetPort: http }
