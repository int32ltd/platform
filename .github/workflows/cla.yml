name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-24.04
    steps:
      - name: Mint CLA bot token
        id: cla-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLA_APP_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}

      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used for writes to the cla-signatures branch. The branch ruleset
          # only lets this app bypass the update restriction.
          PERSONAL_ACCESS_TOKEN: ${{ steps.cla-token.outputs.token }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          create-file-commit-message: 'chore: create CLA signature file'
          signed-commit-message: 'chore: $contributorName has signed the CLA'
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before we can merge it, you need to
            sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md).
            Reply to this PR with the comment below to sign.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
          # allowlist: 'dependabot[bot],renovate[bot]'
